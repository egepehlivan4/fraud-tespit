<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Model Yönetimi</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 40px auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
        .bilgi { color: #2e7d32; }
        .hata { color: #b00020; }
        form.satir-form { display: inline; }
    </style>
</head>
<body>
<p><a th:href="@{/admin}">&larr; Admin ana sayfa</a></p>
<h2>Model Yönetimi</h2>
<p>Her hesabın kişisel harcama profili (EWMA ortalama/sapma). "Yeniden eğit" geçmiş
onaylı işlemlerden modeli sıfırdan hesaplar — <code>sp_profil_yeniden_egit</code> çağrılır,
mantık Java'da tekrar yazılmaz.</p>

<p th:if="${bilgi}" class="bilgi" th:text="${bilgi}"></p>
<p th:if="${hata}" class="hata" th:text="${hata}"></p>

<table>
    <tr><th>Hesap</th><th>Sahip</th><th>Ortalama (TL)</th><th>Std. Sapma</th><th>Eğitilen Ay</th><th>Son Ay</th><th></th></tr>
    <tr th:each="m : ${modeller}">
        <td th:text="${m.iban()}"></td>
        <td th:text="${m.sahip()}"></td>
        <td th:text="${m.ortalama() != null ? m.ortalama() : '—'}"></td>
        <td th:text="${m.varyans() != null ? m.varyans() : '—'}"></td>
        <td th:text="${m.egitilenAySayisi()}"></td>
        <td th:text="${m.sonAy() != null ? m.sonAy() : '—'}"></td>
        <td>
            <form class="satir-form" method="post" th:action="@{/admin/model/{id}/yeniden-egit(id=${m.hesapId()})}"
                  onsubmit="return confirm('Bu hesabin modeli sifirdan yeniden egitilecek. Emin misiniz?');">
                <button type="submit">Yeniden eğit</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
