<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kart Yönetimi</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 40px auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
        .bilgi { color: #2e7d32; }
        .hata { color: #b00020; }
        form.satir-form { display: inline; }
        .filtre { margin-top: 12px; }
    </style>
</head>
<body>
<p><a th:href="@{/admin}">&larr; Admin ana sayfa</a></p>
<h2>Kart Yönetimi</h2>

<p th:if="${bilgi}" class="bilgi" th:text="${bilgi}"></p>
<p th:if="${hata}" class="hata" th:text="${hata}"></p>

<form class="filtre" method="get" th:action="@{/admin/kartlar}">
    <label>Durum:
        <select name="durum">
            <option value="" th:selected="${secilenDurum == null}">Hepsi</option>
            <option value="AKTIF" th:selected="${secilenDurum == 'AKTIF'}">AKTIF</option>
            <option value="BLOKE" th:selected="${secilenDurum == 'BLOKE'}">BLOKE</option>
            <option value="IPTAL" th:selected="${secilenDurum == 'IPTAL'}">IPTAL</option>
        </select>
    </label>
    <button type="submit">Filtrele</button>
</form>

<p><a th:href="@{/admin/kartlar/yeni}">+ Yeni kart tanımla</a></p>

<table>
    <tr><th>Id</th><th>Sahip</th><th>Hesap (IBAN)</th><th>Son 4</th><th>Durum</th><th>İşlem</th></tr>
    <tr th:each="k : ${kartlar}">
        <td th:text="${k.id()}"></td>
        <td th:text="${k.sahip()}"></td>
        <td th:text="${k.iban()}"></td>
        <td th:text="${k.son4()}"></td>
        <td th:text="${k.durum()}"></td>
        <td>
            <form class="satir-form" method="post" th:action="@{/admin/kartlar/{id}/durum(id=${k.id()})}"
                  th:if="${k.durum() != 'IPTAL'}">
                <select name="yeniDurum">
                    <option value="AKTIF" th:selected="${k.durum() == 'AKTIF'}">AKTIF</option>
                    <option value="BLOKE" th:selected="${k.durum() == 'BLOKE'}">BLOKE</option>
                    <option value="IPTAL">IPTAL</option>
                </select>
                <button type="submit">Uygula</button>
            </form>
            <span th:if="${k.durum() == 'IPTAL'}"><em>iptal edilmiş</em></span>
        </td>
    </tr>
</table>
</body>
</html>
